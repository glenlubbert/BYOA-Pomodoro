<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Focus Timer</h1>
            <div class="stats">
                <span class="completed">Completed: 0</span>
            </div>
        </header>
        
        <main>
            <div class="timer-container">
                <div class="timer-circle">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-background" cx="50" cy="50" r="45"/>
                        <circle class="timer-progress" cx="50" cy="50" r="45"/>
                    </svg>
                    <div class="timer-content">
                        <div class="time-display">25:00</div>
                        <div class="timer-label">Focus Time</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="start" class="control-btn primary">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">Start</span>
                </button>
                <button id="pause" class="control-btn secondary" disabled>
                    <span class="btn-icon">⏸</span>
                    <span class="btn-text">Pause</span>
                </button>
                <button id="reset" class="control-btn secondary">
                    <span class="btn-icon">↺</span>
                    <span class="btn-text">Reset</span>
                </button>
            </div>
        </main>

        <div class="mode-selector">
            <button class="mode active" data-time="25">
                <span class="mode-icon">🍅</span>
                <span class="mode-text">Focus</span>
                <span class="mode-time">25 min</span>
            </button>
            <button class="mode" data-time="5">
                <span class="mode-icon">☕</span>
                <span class="mode-text">Short Break</span>
                <span class="mode-time">5 min</span>
            </button>
            <button class="mode" data-time="15">
                <span class="mode-icon">🌴</span>
                <span class="mode-text">Long Break</span>
                <span class="mode-time">15 min</span>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
